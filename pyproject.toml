[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-node-pure"
version = "0.1.0"
description = "Educational Bitcoin primitives (pure Python core), CLI with Rich + P2P helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bitcoin-node-pure" }]
dependencies = [
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "questionary>=2.0.1",
]

[project.scripts]
btc-pure = "bitcoin_node.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
